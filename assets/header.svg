<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ISSEI — System Builder">
  <title>ISSEI — SYSTEM BUILDER</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#120B24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#18243B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="960" cy="150" rx="300" ry="220" fill="url(#glow)"/>

  <!-- starfield -->
  <g fill="#C9D1D9">
    <circle cx="112" cy="42" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="268" r="1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="34" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="252" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="7s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="58" r="1.1" opacity="0.45"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="726" cy="214" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="6.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="46" r="1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.2s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1064" cy="262" r="1.2" opacity="0.45"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1148" cy="86" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="6.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1006" cy="30" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="5.9s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="188" r="1" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="7.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="288" r="1.1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.1s" begin="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbital system: physics / cloud / code in one mark -->
  <g>
    <g transform="rotate(-18 960 150)">
      <ellipse cx="960" cy="150" rx="196" ry="72" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.45"/>
      <circle r="4.5" fill="#22D3EE">
        <animateMotion dur="9s" repeatCount="indefinite" path="M 764,150 a 196,72 0 1,0 392,0 a 196,72 0 1,0 -392,0"/>
      </circle>
    </g>
    <g transform="rotate(46 960 150)">
      <ellipse cx="960" cy="150" rx="196" ry="72" fill="none" stroke="#8B5CF6" stroke-width="1.2" opacity="0.45"/>
      <circle r="4" fill="#A78BFA">
        <animateMotion dur="13s" repeatCount="indefinite" path="M 764,150 a 196,72 0 1,0 392,0 a 196,72 0 1,0 -392,0"/>
      </circle>
    </g>
    <g transform="rotate(96 960 150)">
      <ellipse cx="960" cy="150" rx="196" ry="72" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.28"/>
      <circle r="3" fill="#7DD3FC">
        <animateMotion dur="17s" repeatCount="indefinite" path="M 764,150 a 196,72 0 1,0 392,0 a 196,72 0 1,0 -392,0"/>
      </circle>
    </g>
    <circle cx="960" cy="150" r="9" fill="#E6EDF3" opacity="0.9">
      <animate attributeName="r" values="8;10.5;8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="22" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="16;46;16" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- signal / waveform -->
  <path d="M0 262 C 90 232, 150 292, 240 262 S 390 232, 480 262 S 630 292, 720 262"
        fill="none" stroke="#22D3EE" stroke-width="1.4" opacity="0.22"
        stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- left accent -->
  <rect x="60" y="62" width="4" height="176" fill="url(#accent)"/>

  <!-- text block -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="92" cy="82" r="3.5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="87" font-size="13" letter-spacing="4" fill="#5FE3F5" opacity="0.85">SYSTEM ONLINE</text>

    <text x="88" y="172" font-size="80" font-weight="700" letter-spacing="14" fill="#F0F6FC">ISSEI</text>
    <text x="92" y="208" font-size="21" font-weight="600" letter-spacing="9" fill="#22D3EE">SYSTEM BUILDER</text>
    <text x="92" y="240" font-size="13" letter-spacing="3.2" fill="#7A8699">THEORETICAL PHYSICS / BACKEND / AWS / AI</text>

    <text x="1140" y="284" font-size="13" letter-spacing="1" fill="#3E5170" text-anchor="end">iħ ∂ψ/∂t = Hψ</text>
  </g>

  <!-- scanline -->
  <rect x="0" y="-70" width="1200" height="70" fill="url(#scan)">
    <animate attributeName="y" values="-70;300" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1E3A5F" stroke-width="1"/>
</svg>
