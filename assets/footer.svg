<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Escape the Vibe. Build the System.">
  <title>Escape the Vibe. Build the System.</title>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120B24"/>
      <stop offset="0.5" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#18243B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="150" fill="url(#fbg)"/>
  <rect width="1200" height="150" fill="url(#fgrid)" opacity="0.5"/>

  <g fill="#C9D1D9">
    <circle cx="180" cy="36" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="112" r="1.2" opacity="0.45"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="6.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="28" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="4.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="7s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="240" y="40" width="720" height="1" fill="url(#rule)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="600" y="86" font-size="26" font-weight="700" letter-spacing="2" fill="#F0F6FC">Ideas are cheap.
      <tspan fill="#22D3EE"> Systems are real.</tspan>
    </text>
    <text x="600" y="118" font-size="13" letter-spacing="3.4" fill="#7C8AA3">ESCAPE THE VIBE. BUILD THE SYSTEM.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="1140" cy="26" r="3.5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1128" y="30" font-size="11" letter-spacing="2" fill="#3E5170" text-anchor="end">STATUS: SHIPPING</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="149" fill="none" stroke="#1E3A5F" stroke-width="1"/>
</svg>
